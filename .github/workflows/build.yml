name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK manually
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"
          
          mkdir -p app/build/classes
          
          # Компиляция java
          javac -d app/build/classes -classpath "$PLATFORM" app/src/main/java/com/kalobanga/mhp/MainActivity.java
          
          # Конвертация в dex (полный путь к d8)
          "$BUILD_TOOLS/d8" --lib "$PLATFORM" --output app/build/ app/build/classes/com/kalobanga/mhp/MainActivity.class
          
          # Сборка ресурсов и манифеста
          "$BUILD_TOOLS/aapt2" link -o app/build/app-unsigned.apk -I "$PLATFORM" --manifest app/src/main/AndroidManifest.xml -A app/src/main/assets
          
          cd app/build
          
          # Добавление dex в apk
          zip -uj app-unsigned.apk classes.dex
          
          # Создание ключа
          keytool -genkey -v -keystore my.keystore -alias alias_name -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Android, OU=Android, O=Android, L=Android, ST=Android, C=US"
          
          # Выравнивание и подпись
          "$BUILD_TOOLS/zipalign" -v 4 app-unsigned.apk app-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks my.keystore --ks-pass pass:password --key-pass pass:password --out app-debug.apk app-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KalobangaMHP-debug
          path: app/build/app-debug.apk
